<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Timing App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .stop-item {
            border-left: 4px solid #3b82f6;
            padding-left: 1rem;
        }
        .banner-shell {
            width: 100vw;
            margin-left: calc(50% - 50vw);
            margin-right: calc(50% - 50vw);
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex flex-col">
        <!-- Header -->
        <header class="banner-shell shadow-lg overflow-hidden bg-white py-0">
            <img src="Images/Banner1.png" alt="Bus Timing App banner" class="block w-full h-auto" />
        </header>

        <!-- Main Content -->
        <main class="flex-1 max-w-4xl mx-auto w-full px-4 py-6">
            <!-- Search Section -->
            <div class="bg-white rounded-lg shadow-md p-6 mb-6">
                <h2 class="text-xl font-semibold text-gray-800 mb-4">Search Buses</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <!-- From Dropdown -->
                    <div>
                        <label for="fromLocation" class="block text-sm font-medium text-gray-700 mb-2">
                            From
                        </label>
                        <select id="fromLocation" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="">-- Select departure stop --</option>
                        </select>
                    </div>

                    <!-- To Dropdown -->
                    <div>
                        <label for="toLocation" class="block text-sm font-medium text-gray-700 mb-2">
                            To
                        </label>
                        <select id="toLocation" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" disabled>
                            <option value="">-- Select destination stop (Choose 'From' first) --</option>
                        </select>
                    </div>
                </div>

                <button id="searchBtn" class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-8 rounded-lg disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors" disabled>
                    Search Buses
                </button>
            </div>

            <!-- Results Section -->
            <div id="resultsContainer" class="hidden">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-gray-800" id="resultsTitle"></h2>
                    <button id="clearSearchBtn" class="bg-gray-500 hover:bg-gray-600 text-white font-semibold py-2 px-6 rounded-lg transition-colors">
                        Clear
                    </button>
                </div>

                <!-- Bus Results -->
                <div id="busResults" class="space-y-4">
                    <!-- Bus cards will be inserted here -->
                </div>

                <!-- No Results Message -->
                <div id="noResultsMsg" class="bg-yellow-50 border-l-4 border-yellow-400 p-4 rounded hidden">
                    <p class="text-yellow-800 font-semibold">No buses found for this route.</p>
                    <p class="text-yellow-700 text-sm mt-1">Try selecting different locations.</p>
                </div>
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="text-center py-12">
                <div class="text-6xl mb-4">🚌</div>
                <h3 class="text-xl font-semibold text-gray-600 mb-2">Find Your Bus</h3>
                <p class="text-gray-500">Select your departure and destination locations to search for available buses.</p>
            </div>
        </main>

        <!-- Footer -->
        <footer class="bg-gray-800 text-gray-300 py-4 mt-12">
            <div class="max-w-4xl mx-auto px-4 text-center">
                <p id="visitorCount" class="text-sm mb-2" aria-live="polite">Visits: loading...</p>
                <p class="text-sm">&copy; 2026 Bus Timing App. All rights reserved.</p>
            </div>
        </footer>
    </div>

    <script src="app.js?v=20260912"></script>
</body>
</html>
